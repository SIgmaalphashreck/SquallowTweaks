name: Build RISEN TWEAKS for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python (cloud runner only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Build standalone EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name RISEN_TWEAKS --collect-all customtkinter main.py

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: RISEN_TWEAKS-Windows-EXE
          path: dist/RISEN_TWEAKS.exe
          if-no-files-found: error
          retention-days: 14
